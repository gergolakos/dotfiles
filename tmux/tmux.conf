unbind C-b
set -g prefix `
bind-key ` last-window
bind-key e send-prefix
bind-key k select-pane -U
bind-key j select-pane -D
bind-key h select-pane -L
bind-key l select-pane -R

# unbind r
# bind r source-file ~/.tmux.conf

set -g status-position bottom
set -g status-bg colour234
set -g status-fg colour137
set -g status-left ''
set -g status-right '#[fg=colour233,bg=colour241,bold] #{uptime} %d/%m #[fg=colour233,bg=colour245,bold] %H:%M:%S '
set -g status-right-length 50
set -g status-left-length 20
# set -g mouse on
set -g base-index 1
set -g renumber-windows on
set -g mode-keys vi

setw -g window-status-current-format ' #I#[fg=colour250]:#[fg=colour255]#W#[fg=colour50]#F '
setw -g window-status-format ' #I#[fg=colour237]:#[fg=colour250]#W#[fg=colour244]#F '

set-option -g history-limit 10000

set -s escape-time 0  # otherwise lags in Vim

# Last saved environment is automatically restored when tmux is started
# set -g @continuum-restore 'on'

# fix alacritty true color issue
set -sg terminal-overrides ",*:RGB"
## set unshared history between windows and panes
#set-option -g noincappendhistory >> ~/.zshrc
#set-option -g nosharehistory >> ~/.zshrc

# Copy Mode
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
set -g word-separators " "
bind-key -T copy-mode-vi 'w' send-keys -X select-word

# List of plugins (https://github.com/tmux-plugins/list)
# Insatll tmp: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# Hit prefix + I to fetch the plugin and source it.
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'robhurring/tmux-uptime'
set -g @plugin 'tmux-plugins/tmux-copycat'
set -g @plugin 'tmux-plugins/tmux-open'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# set -g @plugin 'tmux-plugins/tmux-continuum'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

